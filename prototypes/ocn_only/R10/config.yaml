  atm: [950, 1000]
  ocn: [0, 1, 5, 10, 20, 40, 70, 120, 200, 350, 500]
  ice: []
  land: []

# === Training Hyperparameters ===
gnn_msg_steps: 12
latent_size: 256
lr_peak_value: 1e-3
