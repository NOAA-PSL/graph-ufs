# === Experiment specific ===
case: R12
sub_expt: T1M
# Reuses R8's preprocessed training/validation data (identical interfaces,
# variables, delta_t) instead of reprocessing ~1.2TB from scratch -- only the
# Mahalanobis loss covariance differs between R8 and R12, so local_store_path
# points at R8's tree for INPUT DATA ONLY (data.zarr/training/validation).
# `output_dir` below overrides where model checkpoints, loss, and tensorboard
# logs get written, so R12's own outputs stay under R12's directory instead
# of landing in R8's (see checkpoint_dir/output_store_path in
# graphufs/coupledemulator.py). The first run here (T1_spacecov, completed
# 2026-09-14) predates this override and had to be moved after the fact --
# see R12/README.md.
local_store_path: "/pscratch/sd/n/nagarwal/ocn-only/R8"
output_dir: "/pscratch/sd/n/nagarwal/ocn-only/${case}"
use_half_precision: false
log_tensorboard: true
logdir: "${output_dir}/tensorboard/${sub_expt}"

# === Time Configuration Overrides ===
delta_t_model: 24h
delta_t_data: 6h
input_duration: 24h
target_lead_time: 24h

# === Base statistics directory ===
statistics_path: "/global/homes/n/nagarwal/graph-ufs/prototypes/ocn_only/statistics/ocn_only_7L_coarseTop/${delta_t_model}"

# === Norm Stats Path Override ===
norm_urls:
  atm:
    mean: "${statistics_path}/atm.fvstatistics.1993-2019/mean_by_level.zarr"
    std: "${statistics_path}/atm.fvstatistics.1993-2019/stddev_by_level.zarr"
    stddiff: "${statistics_path}/atm.fvstatistics.1993-2019/diffs_stddev_by_level.zarr"
  ocn:
    mean: "${statistics_path}/ocn.fvstatistics.1993-2019/mean_by_level.zarr"
    std: "${statistics_path}/ocn.fvstatistics.1993-2019/stddev_by_level.zarr"
    stddiff: "${statistics_path}/ocn.fvstatistics.1993-2019/diffs_stddev_by_level.zarr"
  ice: { mean: "", std: "", stddiff: "" }
  land: { mean: "", std: "", stddiff: "" }

# === Interface Configuration ===
interfaces:
  atm: [950, 1000]
  ocn: [0, 1, 21, 75, 120, 200, 350, 500]
  ice: []
  land: []

# === Training Hyperparameters ===
gnn_msg_steps: 12
latent_size: 256
lr_peak_value: 1e-3
num_epochs: 40

# === loss related ===
use_mahalanobis_loss: true
tend_corr_dir: "/global/homes/n/nagarwal/graph-ufs/prototypes/ocn_only/tendency_correlations"
# Location-based (nlat, nlon, nchannels, nchannels) tendency covariance,
# instead of R8's spatially-averaged (nchannels, nchannels) one.
mah_metric_file: "${tend_corr_dir}/tendency_correlation_ocn_only_${delta_t_model}_rm_seasonality_space_dependent.nc"
# Shrinkage towards diag(diag(cov)) applied per grid cell before Cholesky
# decomposition, to fix the ill-conditioning caused by highly-correlated
# channels at high latitudes (worst observed condition number ~1e6 at
# lat=-64.8 with alpha=0, vs. ~130 at alpha=0.05). See graphufs/utils.py
# shrink_covariance().
mah_covariance_shrinkage: 0.05
